<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forthside 3D Massing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,600;125,800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height 3D viewport with a working side panel (stacks under the view on phones).
   Braxton brand system, single dark look by design: Forge ground, Haar type, Teal as the signal, Slate for UI surfaces. */
:root{
  --forge:#0C1113; --haar:#EEF1EF; --teal:#2ED0C3; --slate:#172024;
  --bg:var(--forge); --panel:var(--slate); --fg:var(--haar); --muted:#8C9A97; --line:#26333A;
  --accent:#2ED0C3; --accent-ink:#0C1113; --hub:#5D6B70;
  --scene:#0C1113; --ground:#141C1F;
  --display:'Archivo',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);margin:0}
.app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding-inline:16px;padding-block:12px;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
header img{height:34px;width:auto}
h1,.panel h2{font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.02}
h1{font-size:24px;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--teal)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--teal);text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tabs button{font:600 14px var(--display);color:var(--fg);background:transparent;border:1.5px solid var(--line);padding:10px 14px;min-height:44px;border-radius:2px;cursor:pointer}
.tabs button:hover{border-color:var(--teal)}
.tabs button[aria-pressed="true"]{background:var(--teal);color:var(--accent-ink);border-color:var(--teal)}
.tabs button:focus-visible,.panel button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{flex:1;min-height:0;display:flex;gap:12px}
.view{position:relative;flex:1;min-width:0;border:1px solid var(--line);background:var(--scene);overflow:hidden}
.view canvas{display:block;width:100%;height:100%;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:10.5px;line-height:1.25;letter-spacing:.05em;text-transform:uppercase;color:var(--fg);background:rgba(12,17,19,.86);border-left:2px solid var(--line);padding:4px 7px;white-space:nowrap}
.lbl b{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:12px;display:block}
.lbl.on{border-left-color:var(--accent)}
.hint{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.panel{width:300px;flex:none;background:var(--panel);border:1px solid var(--line);padding:16px;box-sizing:border-box;overflow:auto;display:flex;flex-direction:column;gap:18px}
.panel h2{font-size:20px;margin:0;font-weight:800;text-wrap:balance}
.panel p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.ctl output{color:var(--fg);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);min-height:28px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;min-height:32px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.rooms{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rooms button{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;font:14px var(--display);color:var(--fg);background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;min-height:44px;cursor:pointer}
.rooms button span:last-child{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rooms button[aria-pressed="true"]{color:var(--accent)}
.sw{width:10px;height:10px;flex:none;margin-right:8px;display:inline-block;border:1px solid var(--fg)}
.note{font-family:var(--mono);font-size:10.5px;line-height:1.6;color:var(--muted);margin-top:auto}
@media (max-width:820px){
  .main{flex-direction:column}
  .view{min-height:58vh}
  .panel{width:auto}
  .app{height:auto}
  html,body{height:auto}
}
</style>
<style>[hidden]{display:none!important}</style>
</head>

const toShape = pts => { const s = new THREE.Shape(); pts.forEach(([x,z],i)=> i? s.lineTo(x,-z): s.moveTo(x,-z)); return s; };
const flat = (pts,y,mat) => { const g = new THREE.ShapeGeometry(toShape(pts)); g.rotateX(-Math.PI/2); const m = new THREE.Mesh(g,mat); m.position.y=y; m.receiveShadow=true; return m; };
const extrude = (pts,h,mat) => { const g = new THREE.ExtrudeGeometry(toShape(pts),{depth:h,bevelEnabled:false}); g.rotateX(-Math.PI/2); const m = new THREE.Mesh(g,mat); m.castShadow=m.receiveShadow=true; return m; };
const ribbon = (pts,w,y,mat) => {
  const pos=[]; for(let i=0;i<pts.length-1;i++){ const [x1,z1]=pts[i],[x2,z2]=pts[i+1]; const dx=x2-x1,dz=z2-z1,l=Math.hypot(dx,dz)||1, nx=-dz/l*w/2, nz=dx/l*w/2;
    pos.push(x1+nx,y,z1+nz, x2+nx,y,z2+nz, x2-nx,y,z2-nz,  x1+nx,y,z1+nz, x2-nx,y,z2-nz, x1-nx,y,z1-nz); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat); m.receiveShadow=true; return m; };

const M = {
  ground:new THREE.MeshStandardMaterial({roughness:1}),
  water:new THREE.MeshStandardMaterial({color:0x1E3A40,roughness:.3}),
  road:new THREE.MeshStandardMaterial({color:0x2A3438,roughness:1, side:THREE.DoubleSide}),

};
function paint(){
  M.ground.color.set(css('--ground')); scene.background = new THREE.Color(css('--scene'));

  roomMeshes.forEach(r=> r.c==='accent' && r.vol.material.color.set(css('--accent')));
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2400,2400), M.ground);
ground.rotation.x=-Math.PI/2; ground.position.y=-0.05; ground.receiveShadow=true; scene.add(ground);

{ const pts = GEO.mod.map(([x,z])=>new THREE.Vector3(x,0.3,z)); const g=new THREE.BufferGeometry().setFromPoints(pts);
  const l=new THREE.Line(g,new THREE.LineDashedMaterial({color:0xEEF1EF,dashSize:6,gapSize:4})); l.computeLineDistances(); scene.add(l); }

const ctxGroup = new THREE.Group(); scene.add(ctxGroup);
const shells = {};
GEO.buildings.forEach(b=>{
  if(b.id===CB||b.id===ST){ shells[b.id]=b; return; }
  if(b.id===HUB){ scene.add(extrude(b.pts,14,M.hub)); return; }
  const h = b.inside ? (b.m2>1500?9:6) : 7;
  const m = extrude(b.pts,h,b.inside?M.site:M.ctx);
  (b.inside? scene : ctxGroup).add(m);
});

// Braxton shells: walls + roof so the roof can come off
const shellGroup = new THREE.Group(); scene.add(shellGroup);
const roofs = [];
function buildShells(H){
  shellGroup.clear(); roofs.length=0;
  [CB,ST].forEach(id=>{ const p = shells[id].pts;
    for(let i=0;i<p.length-1;i++){ const [x1,z1]=p[i],[x2,z2]=p[i+1]; const l=Math.hypot(x2-x1,z2-z1); if(l<0.1) continue;
      const w=new THREE.Mesh(new THREE.BoxGeometry(l,H,0.35),M.brax); w.position.set((x1+x2)/2,H/2,(z1+z2)/2); w.rotation.y=-Math.atan2(z2-z1,x2-x1); w.castShadow=w.receiveShadow=true; shellGroup.add(w); }
    const r = flat(p,H,M.roof); r.castShadow=true; shellGroup.add(r); roofs.push(r);
  });
  applyRoof();
}

// ---------- rooms ----------
const roomMeshes = [];
function buildRooms(key){
  const R=ROOMS[key], [ox,oz]=R.origin, g=new THREE.Group(); g.userData.key=key; scene.add(g);
  if(R.corridor){ const c=R.corridor; const f=new THREE.Mesh(new THREE.PlaneGeometry(c.w,c.d),new THREE.MeshStandardMaterial({color:0xE8ECE9})); f.rotation.x=-Math.PI/2; f.position.set(ox+c.x+c.w/2,0.06,oz+c.y+c.d/2); g.add(f); }
  R.items.forEach(it=>{
    const col = it.c==='accent'? css('--accent') : it.c;
    const cx=ox+it.x+it.w/2, cz=oz+it.y+it.d/2;
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(it.w-0.1,it.d-0.1),new THREE.MeshStandardMaterial({color:col,roughness:.9}));
    floor.rotation.x=-Math.PI/2; floor.position.set(cx,0.08,cz); floor.receiveShadow=true; g.add(floor);
    const vol=new THREE.Mesh(new THREE.BoxGeometry(it.w,it.h,it.d),new THREE.MeshStandardMaterial({color:col,transparent:true,opacity:0.22,depthWrite:false}));
    vol.position.set(cx,it.h/2,cz); g.add(vol);
    const edges=new THREE.LineSegments(new THREE.EdgesGeometry(vol.geometry),new THREE.LineBasicMaterial({color:0xEEF1EF,transparent:true,opacity:.45}));
    edges.position.copy(vol.position); g.add(edges);
    if(it.desks){ for(let i=0;i<it.desks;i++){ const cols=Math.min(4,it.desks), r=Math.floor(i/cols), c=i%cols;
      const d=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.75,0.8),new THREE.MeshStandardMaterial({color:0xF2F2EE}));
      d.position.set(ox+it.x+ (c+0.5)*it.w/cols, 0.38, oz+it.y+2+r*3); d.castShadow=true; g.add(d);} }
    if(/^Edit/.test(it.n)){ const d=new THREE.Mesh(new THREE.BoxGeometry(Math.min(2.4,it.w-0.6),0.75,0.8),new THREE.MeshStandardMaterial({color:0xF2F2EE})); d.position.set(cx,0.38,oz+it.y+1); d.castShadow=true; g.add(d); }
    if(it.n==='Studio A'||it.n==='Set'){ // lighting grid + cyc
      const gh=it.h-0.6, grid=new THREE.Group();
      for(let a=1;a<it.w;a+=3){ const b=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,it.d-1),new THREE.MeshStandardMaterial({color:0x2A302D})); b.position.set(ox+it.x+a,gh,cz); grid.add(b); }
      g.add(grid);
      const cyc=new THREE.Mesh(new THREE.CylinderGeometry(2,2,it.d*0.7,24,1,true,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0xFAFAF7,side:THREE.DoubleSide}));
      cyc.rotation.x=Math.PI/2; cyc.rotation.z=Math.PI; cyc.position.set(ox+it.x+2.2,2,cz); g.add(cyc);
      const wall=new THREE.Mesh(new THREE.BoxGeometry(0.1,it.h-2,it.d*0.7),new THREE.MeshStandardMaterial({color:0xFAFAF7})); wall.position.set(ox+it.x+0.2,2+(it.h-2)/2,cz); g.add(wall);
    }
    roomMeshes.push({key, it, vol, floor, c:it.c, area:it.w*it.d, pos:new THREE.Vector3(cx,it.h+1,cz)});
  });
}

function drawLabels(){
  const W=host.clientWidth,H=host.clientHeight, v=new THREE.Vector3();
  labels.forEach(l=>{ v.copy(l.pos).project(camera); const vis=v.z<1&&v.x>-1.1&&v.x<1.1&&v.y>-1.1&&v.y<1.1;
    l.el.hidden=!vis; if(vis){ l.el.style.left=((v.x+1)/2*W)+'px'; l.el.style.top=((1-v.y)/2*H)+'px'; }
    l.el.classList.toggle('on', !!active && l.ref===active); });
}

// ---------- views & controls ----------
let view='site';
const roofChk=document.getElementById('roof'), ctxChk=document.getElementById('ctx');
function applyRoof(){ roofs.forEach(r=> r.visible = roofChk.checked); }
function setView(v,animate=true){
  view=v; active=null;
  document.querySelectorAll('.tabs button').forEach(b=> b.setAttribute('aria-pressed', b.dataset.view===v));
  const V=VIEWS[v]; document.getElementById('p-title').textContent=V.title; document.getElementById('p-text').textContent=V.text;
  roofChk.checked = v==='site'; applyRoof();
  fly(new THREE.Vector3(...V.cam), new THREE.Vector3(...V.target), animate);
  renderRoomList(); setLabels(v); highlight();
}
let flyT=null;
function fly(pos,tgt,animate){
  if(!animate||matchMedia('(prefers-reduced-motion: reduce)').matches){ camera.position.copy(pos); controls.target.copy(tgt); return; }
  flyT={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:performance.now()};
}
function renderRoomList(){
  const box=document.getElementById('rooms'); box.innerHTML='';
  if(view==='site'){ box.hidden=true; return; } box.hidden=false;
  roomMeshes.filter(r=>r.key===view).forEach(r=>{
    const b=document.createElement('button'); b.type='button'; b.setAttribute('aria-pressed','false');
    const col = r.c==='accent'? 'var(--accent)' : r.c;
    b.innerHTML=`<span><i class="sw" style="background:${col}"></i>${r.it.n}${r.it.s? ' · '+r.it.s:''}</span><span>${r.area} m²</span>`;
    b.onclick=()=>{ active = active===r? null : r; highlight(); };
    r.btn=b; box.appendChild(b);
  });
}
function highlight(){
  roomMeshes.forEach(r=>{ const on=active===r; r.vol.material.opacity = on? .55 : (active? .1 : .22); r.btn && r.btn.setAttribute('aria-pressed', on); });
}
document.querySelectorAll('.tabs button').forEach(b=> b.onclick=()=>setView(b.dataset.view));
roofChk.onchange=applyRoof; ctxChk.onchange=()=> ctxGroup.visible=ctxChk.checked;
const hIn=document.getElementById('h'), hOut=document.getElementById('h-out');
hIn.oninput=()=>{ hOut.textContent=hIn.value+' m'; buildShells(+hIn.value); };
const sunIn=document.getElementById('sun'), sunOut=document.getElementById('sun-out');
function placeSun(){ const t=+sunIn.value/100, az=Math.PI*(0.15+0.7*t), el=0.15+Math.sin(Math.PI*t)*0.75;
  sun.position.set(Math.cos(az)*-400, Math.sin(el)*500+40, Math.sin(az)*300+120); sun.target.position.set(0,0,0);
  sunOut.textContent = t<0.2?'morning, east': t<0.4?'late morning': t<0.6?'midday': t<0.8?'afternoon':'evening, west'; }
sunIn.oninput=placeSun;

function resize(){ const w=host.clientWidth,h=host.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(host);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paint);
new MutationObserver(paint).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function loop(now){
  if(flyT){ const k=Math.min(1,(now-flyT.s)/900), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(flyT.p0,flyT.p1,e); controls.target.lerpVectors(flyT.t0,flyT.t1,e); if(k===1) flyT=null; }
  controls.update(); renderer.render(scene,camera); drawLabels(); requestAnimationFrame(loop);
}
const start = location.hash.replace('#','');
buildShells(8); paint(); placeSun(); resize(); setView(VIEWS[start]? start : 'site', false); requestAnimationFrame(loop);
</script>
